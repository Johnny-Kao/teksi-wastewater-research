name: TEKSI transaction boundary research
on:
  push:
    paths:
      - '.github/workflows/transaction-boundary.yml'
      - 'research/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-transaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: research
          POSTGRES_USER: research
          POSTGRES_DB: research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research -d research"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://research:research@127.0.0.1:5432/research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: teksi/wastewater
          ref: 553ce1bdaf0f21329d5c706c76daac3ced229095
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL driver
        run: python -m pip install 'psycopg[binary]==3.2.13'
      - name: Run actual upstream context manager against PostgreSQL
        run: python research/test_transaction_boundary.py
