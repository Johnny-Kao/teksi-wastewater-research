name: QGIS legacy hydraulic field audit
on:
  push:
    branches:
      - research/qgis-legacy-field-audit-20261123
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
      - name: Read upstream project without changing it
        run: git clone --depth 1 https://github.com/teksi/wastewater.git /tmp/teksi-upstream
      - name: Audit QGIS XML field references
        run: python3 scripts/audit_qgis_legacy_field.py /tmp/teksi-upstream/project/teksi_wastewater.qgs | tee qgis-legacy-audit.txt
      - name: Preserve audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qgis-legacy-field-audit
          path: qgis-legacy-audit.txt
