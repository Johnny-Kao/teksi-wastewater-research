name: Staging C1-C5 native verification
on:
  push:
    branches:
      - research/qgis-form-display-repair-20261123
    paths:
      - .github/workflows/qgis-staging-c1-c5.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contribution-checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Johnny-Kao/wastewater
          ref: c30fa4e49d5d185e5ee42c96e8cbd8891a2be60b
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify exact staging history and whitespace
        run: |
          test "$(git rev-parse HEAD)" = "c30fa4e49d5d185e5ee42c96e8cbd8891a2be60b"
          test "$(git rev-list --count 0608da0ebd911f4d21a1281e930cd220a78d5f50..HEAD)" = 10
          git diff --check 0608da0ebd911f4d21a1281e930cd220a78d5f50..HEAD
          git diff --stat 0608da0ebd911f4d21a1281e930cd220a78d5f50..HEAD
      - name: Run upstream pre-commit hooks
        run: |
          python -m pip install pre-commit
          pre-commit run --files project/teksi_wastewater.qgs plugin/tests/qgis/test_project_configuration.py .github/workflows/plugin-test.yml
          git diff --exit-code
  roundtrip:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            agxx: false
            webgis: false
          - variant: agxx
            agxx: true
            webgis: false
          - variant: webgis
            agxx: false
            webgis: true
    env:
      QGIS_TEST_VERSION: stable-noble
      PGSERVICE: pg_tww
      COMPOSE_PROFILES: qgis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: full-repair-patch
          path: patch
          run-id: 45710496196
          github-token: ${{ github.token }}
      - name: Fetch exact tested upstream and patch
        run: |
          git init /tmp/teksi-upstream
          git -C /tmp/teksi-upstream remote add origin https://github.com/teksi/wastewater.git
          git -C /tmp/teksi-upstream fetch --depth 1 origin 0608da0ebd911f4d21a1281e930cd220a78d5f50
          git -C /tmp/teksi-upstream checkout --detach FETCH_HEAD
          git -C /tmp/teksi-upstream apply --check "$GITHUB_WORKSPACE/patch/complete.diff"
          cp /tmp/teksi-upstream/project/teksi_wastewater.qgs /tmp/teksi-upstream/project/teksi_wastewater_baseline.qgs
          git -C /tmp/teksi-upstream remote add staging https://github.com/Johnny-Kao/wastewater.git
          git -C /tmp/teksi-upstream fetch --depth 1 staging c30fa4e49d5d185e5ee42c96e8cbd8891a2be60b
          git -C /tmp/teksi-upstream checkout --detach FETCH_HEAD
          test "$(git -C /tmp/teksi-upstream rev-parse HEAD)" = "c30fa4e49d5d185e5ee42c96e8cbd8891a2be60b"
          cmp patch/complete.qgs /tmp/teksi-upstream/project/teksi_wastewater.qgs
          echo "STAGING_QGS_BYTE_IDENTICAL c30fa4e49d5d185e5ee42c96e8cbd8891a2be60b"
      - name: Initialize disposable native database
        working-directory: /tmp/teksi-upstream
        run: |
          set -euo pipefail
          cp .env.example .env
          for attempt in 1 2 3; do
            if docker compose --profile qgis up --build -d; then break; fi
            test "$attempt" -lt 3 || exit 1
            sleep 15
          done
          for attempt in $(seq 1 90); do
            if docker compose exec -T db psql -U postgres -d postgres -tAc "SELECT 1" >/dev/null 2>&1 &&
               docker compose exec -T db createdb -U postgres tww; then
              break
            fi
            sleep 3
          done
          docker compose exec -T db psql -U postgres -d tww -tAc "SELECT 1"
          docker compose run --rm pum -p pg_tww -d datamodel install -p SRID 2056 -p modification_agxx ${{ matrix.agxx }} -p webgis ${{ matrix.webgis }}
      - name: Run staged upstream-style QGIS regression tests
        working-directory: /tmp/teksi-upstream
        run: |
          docker compose exec -T qgis sh -c "xvfb-run -a pytest /usr/src/plugin/tests/qgis/test_project_configuration.py -v -c /usr/src/plugin/pytest.ini"
      - name: Install pinned official relation widget dependencies
        working-directory: /tmp/teksi-upstream
        run: |
          set -euo pipefail
          for dep in lre dms; do
            if [ "$dep" = lre ]; then
              url=https://github.com/opengisch/qgis-linking-relation-editor.git
              revision=81570030504f0eeadfabf9f7a4a1d108fbe2a6dd
            else
              url=https://github.com/opengisch/qgis-document-management-system-plugin.git
              revision=cc241f9cd110b666aee25c47252efc25b5b47739
            fi
            git init "/tmp/teksi-$dep"
            git -C "/tmp/teksi-$dep" remote add origin "$url"
            git -C "/tmp/teksi-$dep" fetch --depth 1 origin "$revision"
            git -C "/tmp/teksi-$dep" checkout --detach FETCH_HEAD
            test "$(git -C "/tmp/teksi-$dep" rev-parse HEAD)" = "$revision"
            docker cp "/tmp/teksi-$dep" "$(docker compose ps -q qgis):/tmp/teksi-$dep"
          done
          docker compose exec -T -u root qgis sh -ec 'for attempt in 1 2 3; do if apt-get -o Acquire::Retries=3 update && apt-get -o Acquire::Retries=3 install -y python3-pyqt5.qtquick qml-module-qtquick-controls qml-module-qtquick-dialogs qml-module-qtquick-layouts; then exit 0; fi; test "$attempt" -lt 3 || exit 1; sleep 15; done'
          docker compose exec -T qgis /usr/bin/python3 -c 'from PyQt5 import QtQuickWidgets; print("Qt Quick preflight PASS")'
      - name: Native GUI and database A/B
        working-directory: /tmp/teksi-upstream
        run: |
          set -euo pipefail
          container="$(docker compose ps -q qgis)"
          docker cp "$GITHUB_WORKSPACE/scripts/qgis_gui_db_roundtrip.py" "$container:/tmp/qgis_gui_db_roundtrip.py" || exit 1
          docker cp "$GITHUB_WORKSPACE/patch/complete.review.json" "$container:/tmp/complete.review.json" || exit 1
          cat > "$GITHUB_WORKSPACE/qgis_desktop_launcher.py" <<'PY'
          import os
          import sys
          import traceback
          import faulthandler
          from qgis.PyQt.QtCore import QTimer
          faulthandler.enable()
          def run_roundtrip():
              try:
                  sys.argv = ["/tmp/qgis_gui_db_roundtrip.py", os.environ["TWW_PROJECT"], "/tmp/complete.review.json", os.environ["TWW_VERSION"], os.environ["TWW_VARIANT"], os.environ["TWW_CASE"]]
                  with open(sys.argv[0], "rb") as source:
                      exec(compile(source.read(), sys.argv[0], "exec"), {"__name__": "__main__"})
              except SystemExit as exc:
                  code = exc.code if isinstance(exc.code, int) else 1
              except BaseException:
                  traceback.print_exc()
                  code = 1
              else:
                  code = 0
              sys.stdout.flush()
              sys.stderr.flush()
              os._exit(code)
          QTimer.singleShot(500, run_roundtrip)
          PY
          docker cp "$GITHUB_WORKSPACE/qgis_desktop_launcher.py" "$container:/tmp/qgis_desktop_launcher.py"
          for version in baseline candidate; do
            if [ "$version" = baseline ]; then qgs=teksi_wastewater_baseline.qgs; else qgs=teksi_wastewater.qgs; fi
            for case in forms display constraints pump insert; do
              status=0
              docker compose exec -T qgis env QT_QPA_PLATFORM=xcb TWW_PROJECT="/usr/src/project/$qgs" TWW_VERSION="$version" TWW_VARIANT="${{ matrix.variant }}" TWW_CASE="$case" timeout 120s xvfb-run -a qgis --nologo --noplugins --noversioncheck --code /tmp/qgis_desktop_launcher.py 2>&1 | tee "$GITHUB_WORKSPACE/gui-$version-$case.txt" || status=$?
              printf '%s\n' "$status" > "$GITHUB_WORKSPACE/gui-$version-$case.exit"
              echo "ROUNDTRIP_EXIT $version $case $status"
            done
          done
          for case in forms display constraints pump insert; do
            test "$(cat "$GITHUB_WORKSPACE/gui-candidate-$case.exit")" = 0
            grep -q "GUI_DB_COMPLETE_PASS candidate" "$GITHUB_WORKSPACE/gui-candidate-$case.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-c1-c5-${{ matrix.variant }}
          path: |
            gui-*.txt
            gui-*.exit
