name: QGIS PostgreSQL full relation catalog check
on:
  push:
    branches:
      - research/qgis-metadata-520-triage-20261123
    paths:
      - scripts/check_qgis_vs_postgres.py
      - .github/workflows/qgis-postgres-schema-check.yml
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Clone TEKSI read only
        run: git clone --depth 1 https://github.com/teksi/wastewater.git /tmp/teksi-upstream
      - name: Create official test database with PUM
        working-directory: /tmp/teksi-upstream
        run: |
          cp .env.example .env
          docker compose up -d db
          until docker compose exec -T db pg_isready -U postgres; do sleep 2; done
          docker compose exec -T db createdb -U postgres tww
          docker compose run --rm pum -p pg_tww -d datamodel install -p SRID 2056
      - name: Export PostgreSQL field catalog
        working-directory: /tmp/teksi-upstream
        run: |
          docker compose exec -T db psql -U postgres -d tww -At -c "SELECT COALESCE(json_agg(row_to_json(t)),'[]'::json) FROM (SELECT ns.nspname AS table_schema, cls.relname AS table_name, att.attname AS column_name FROM pg_catalog.pg_attribute att JOIN pg_catalog.pg_class cls ON att.attrelid=cls.oid JOIN pg_catalog.pg_namespace ns ON cls.relnamespace=ns.oid WHERE ns.nspname IN ('tww_app','tww_od') AND cls.relkind IN ('r','v','m','p','f') AND att.attnum>0 AND NOT att.attisdropped) t;" > "$GITHUB_WORKSPACE/postgres-columns.json"
      - name: Compare metadata against actual views and tables
        run: python3 scripts/check_qgis_vs_postgres.py /tmp/teksi-upstream/project/teksi_wastewater.qgs postgres-columns.json | tee db-schema-summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-qgis-schema-audit
          path: |
            db-schema-summary.txt
            qgis-vs-postgres.json
