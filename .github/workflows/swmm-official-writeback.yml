name: Official PUM SWMM hydraulic-load writeback integration
on:
  push:
    branches:
      - staging/swmm-hydraulic-load-fix-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-writeback:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: research
      - uses: actions/checkout@v4
        with:
          repository: teksi/wastewater
          ref: 553ce1bdaf0f21329d5c706c76daac3ced229095
          path: upstream
          persist-credentials: false
      - name: Reclaim runner storage
        run: |
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
      - name: Launch official PostGIS
        working-directory: upstream
        run: |
          docker compose up -d db
          sleep 12
          for i in $(seq 1 60); do
            docker compose exec -T db psql -U postgres -d postgres -Atqc 'SELECT 1' 2>/dev/null | grep -qx 1 && break
            sleep 3
          done
          docker compose exec -T db createdb -U postgres tww
      - name: Install official data model
        working-directory: upstream
        run: docker compose run --rm -T pum -p pg_tww -d datamodel install -p SRID 2056
      - name: Download official INTERLIS validator
        working-directory: upstream
        run: |
          bash plugin/scripts/download-interlis-libs.sh
          test -s plugin/teksi_wastewater/interlis/bin/ilivalidator-1.15.0.jar
      - name: Build and run official QGIS plugin
        working-directory: upstream
        run: |
          docker compose --profile qgis build qgis
          docker compose --profile qgis up -d qgis
      - name: Import official XTF organization
        working-directory: upstream
        run: docker compose exec -T qgis sh -c 'cd /usr/src/plugin && xvfb-run python3 tww_cmd.py interlis_import --xtf_file /usr/src/plugin/tests/qgis/data/minimal-dataset-organisation-arbon-only.xtf --pghost db --pgdatabase tww --pguser postgres --pgpass postgres --pgport 5432'
      - name: Import official XTF reaches
        working-directory: upstream
        run: docker compose exec -T qgis sh -c 'cd /usr/src/plugin && xvfb-run python3 tww_cmd.py interlis_import --xtf_file /usr/src/plugin/tests/qgis/data/minimal-dataset-SIA405-ABWASSER.xtf --pghost db --pgdatabase tww --pguser postgres --pgpass postgres --pgport 5432'
      - name: Verify imported reach records
        working-directory: upstream
        run: |
          set -e
          count=$(docker compose exec -T db psql -U postgres -d tww -Atqc 'SELECT count(*) FROM tww_od.reach')
          echo "OFFICIAL_REACH_COUNT=$count"
          test "$count" -gt 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SWMM and PostgreSQL Python drivers
        run: python -m pip install 'psycopg[binary]==3.2.13' 'swmm-toolkit==0.17.0'
      - name: Baseline against original upstream (expect broken writeback)
        env:
          OFFICIAL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tww
          EXPECT_BASELINE_FAILURE: '1'
        run: python research/research/test_swmm_official_pum_writeback.py
      - name: Apply only staged two-line patch
        run: git -C upstream apply ../research/research/patches/swmm_hydraulic_load.patch
      - name: Fixed result against same official database
        env:
          OFFICIAL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tww
        run: python research/research/test_swmm_official_pum_writeback.py
      - name: Diagnostics
        if: always()
        working-directory: upstream
        run: docker compose ps
